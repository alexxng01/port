<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CMS - Full Control Panel</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a2a;
            color: #fff;
        }
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: #1a1a3a;
            padding: 25px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #2d2d4a;
        }
        .sidebar h2 {
            text-align: center;
            color: #0ef;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .sidebar h2 i {
            margin-right: 10px;
        }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            margin: 5px 0;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .sidebar nav a:hover {
            background: #0ef;
            color: #1a1a3a;
            transform: translateX(5px);
        }
        .sidebar nav a.active {
            background: #0ef;
            color: #1a1a3a;
        }
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #1e1e3e, #16213e);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
            border: 1px solid #2d2d4a;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #0ef;
        }
        .stat-card h3 {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .stat-card p {
            font-size: 32px;
            font-weight: bold;
            color: #0ef;
        }
        .form-container {
            background: #1e1e3e;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #2d2d4a;
        }
        .form-container h3 {
            margin-bottom: 20px;
            color: #0ef;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0ef;
            font-weight: 500;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #0ef;
            box-shadow: 0 0 10px rgba(0, 238, 255, 0.3);
        }
        .btn-primary {
            background: linear-gradient(90deg, #0ef, #00a3c4);
            color: #1a1a3a;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 238, 255, 0.4);
        }
        .btn-danger {
            background: #ff4757;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: 5px;
        }
        .btn-danger:hover {
            background: #ff6b7c;
            transform: scale(1.02);
        }
        .btn-edit {
            background: #ffa502;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
            transition: all 0.3s;
        }
        .btn-edit:hover {
            background: #ffb43b;
            transform: scale(1.02);
        }
        .btn-small {
            background: #0ef;
            color: #1a1a3a;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .data-table {
            background: #1e1e3e;
            border-radius: 15px;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid #2d2d4a;
        }
        .data-table h3 {
            padding: 20px 20px 0 20px;
            color: #0ef;
        }
        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2d2d4a;
        }
        .data-table th {
            background: #2a2a4a;
            color: #0ef;
            font-weight: 600;
        }
        .data-table tr:hover {
            background: #2a2a4a;
        }
        .skill-item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .skill-item-row input {
            flex: 1;
            padding: 10px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
        }
        .message-card {
            background: #2a2a4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .message-card h4 {
            color: #0ef;
            margin-bottom: 5px;
        }
        .message-card .message-date {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #0ef, #0066cc);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .welcome-text h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .date-time .time {
            font-size: 28px;
            font-weight: bold;
        }
        .login-info {
            background: #2a2a4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .visitor-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .visitor-card {
            background: #1e1e3e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #2d2d4a;
        }
        .visitor-card h4 {
            color: #0ef;
            margin-bottom: 15px;
        }
        .visitor-list {
            max-height: 250px;
            overflow-y: auto;
        }
        .visitor-item {
            padding: 10px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: #0ef;
            color: #1a1a3a;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .backup-item {
            padding: 10px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e3e;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #0ef;
        }
        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }
        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideDown 0.3s ease;
        }
        .alert-success {
            background: rgba(0, 214, 143, 0.2);
            border: 1px solid #00d68f;
            color: #00d68f;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar h2 span, .sidebar nav a span { display: none; }
            .main-content { margin-left: 70px; padding: 15px; }
            .welcome-banner { flex-direction: column; text-align: center; gap: 10px; }
            .login-info { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

        <div class="sidebar">
            <h2><i class='bx bx-code-alt'></i> <span>Portfolio CMS</span></h2>
            <nav>
                <a onclick="showSection('dashboard')" class="active"><i class='bx bxs-dashboard'></i> <span>Dashboard</span></a>

                <a onclick="showSection('about')"><i class='bx bxs-info-circle'></i> <span>About</span></a>
                <a onclick="showSection('services')"><i class='bx bxs-briefcase'></i> <span>Services</span></a>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">

            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Edit Item</h3>

            <button class="btn-primary" onclick="saveEdit()" style="margin-top: 15px;">Save Changes</button>

    <script>
        // Check login
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        // Get current logged in user
        const currentAdmin = JSON.parse(localStorage.getItem('admin_account')) || {};
        const currentProfile = JSON.parse(localStorage.getItem('portfolio_profile')) || {};

        // Global variables for edit
        let currentEditType = null;
        let currentEditIndex = null;

        // ==================== HELPER FUNCTIONS ====================
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = message;
            const mainContent = document.getElementById('mainContent');
            mainContent.insertBefore(alertDiv, mainContent.firstChild);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function getGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) return 'Good Morning';
            if (hour < 18) return 'Good Afternoon';
            return 'Good Evening';
        }

        function updateDateTime() {
            const now = new Date();
            return {
                time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                date: now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
            };
        }

                }));
            }
            if (!localStorage.getItem('admin_account')) {
                localStorage.setItem('admin_account', JSON.stringify({

                    password: 'Admin@123',
                    name: 'Rahul Mahato'
                }));
            }
            if (!localStorage.getItem('portfolio_about')) {

                ]));
            }
            if (!localStorage.getItem('portfolio_skills_technical')) {
                localStorage.setItem('portfolio_skills_technical', JSON.stringify([
                    { id: 1, name: 'HTML5', level: 90, icon: 'bx bxl-html5' },
                    { id: 2, name: 'CSS3', level: 85, icon: 'bx bxl-css3' },
                    { id: 3, name: 'JavaScript', level: 80, icon: 'bx bxl-javascript' },
                    { id: 4, name: 'React', level: 75, icon: 'bx bxl-react' }
                ]));
            }
            if (!localStorage.getItem('portfolio_skills_professional')) {
                localStorage.setItem('portfolio_skills_professional', JSON.stringify([
                    { id: 1, name: 'Creativity', level: 90 },
                    { id: 2, name: 'Communication', level: 65 },
                    { id: 3, name: 'Problem Solving', level: 85 },
                    { id: 4, name: 'Team Work', level: 89 }
                ]));
            }
            if (!localStorage.getItem('portfolio_projects')) {
                localStorage.setItem('portfolio_projects', JSON.stringify([
                    { id: 1, title: 'E-Commerce Dashboard', description: 'Modern admin dashboard.', image: 'images/E-comerce.png', technologies: ['React', 'Node.js'] },
                    { id: 2, title: 'Task Management App', description: 'Collaborative task management.', image: 'images/task-management.png', technologies: ['Vue.js', 'Express'] },
                    { id: 3, title: 'Portfolio Website', description: 'Responsive portfolio website.', image: 'images/website.png', technologies: ['HTML', 'CSS', 'JS'] }
                ]));
            }
            if (!localStorage.getItem('portfolio_teamwork')) {
                localStorage.setItem('portfolio_teamwork', JSON.stringify([
                    { id: 1, title: 'Open Source Contribution', description: 'Collaborated with global developers.', image: '', role: 'Contributor' },
                    { id: 2, title: 'Hackathon Winner', description: 'First place at college hackathon.', image: '', role: 'Team Lead' }
                ]));
            }
            if (!localStorage.getItem('contact_messages')) {
                localStorage.setItem('contact_messages', JSON.stringify([]));
            }
            if (!localStorage.getItem('website_visitors')) {
                localStorage.setItem('website_visitors', JSON.stringify([]));
            }
            if (!localStorage.getItem('total_visitors')) {
                localStorage.setItem('total_visitors', '0');
            }
        }
        initAllData();

        // ==================== DATABASE BACKUP FUNCTIONS ====================
        // IndexedDB Database functions
        const DB_NAME = 'PortfolioDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'portfolioData';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'key' });
                        store.createIndex('key', 'key', { unique: true });
                        store.createIndex('timestamp', 'timestamp');
                    }
                };
            });
        }

        async function saveAllToDB() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                
                const allData = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    allData[key] = localStorage.getItem(key);
                }
                allData['_backup_timestamp'] = new Date().toISOString();
                
                return new Promise((resolve, reject) => {
                    const request = store.put({ key: 'portfolio_backup', data: allData, timestamp: Date.now() });
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error('Backup error:', error);
                return false;
            }
        }

        async function loadAllFromDB() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                
                return new Promise((resolve, reject) => {
                    const request = store.get('portfolio_backup');
                    request.onsuccess = () => {
                        if (request.result && request.result.data) {
                            const data = request.result.data;
                            for (const [key, value] of Object.entries(data)) {
                                if (!key.startsWith('_')) {
                                    localStorage.setItem(key, value);
                                }
                            }
                            resolve(true);
                        } else {
                            resolve(false);
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error('Restore error:', error);
                return false;
            }
        }

        async function getBackupHistory() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const index = store.index('timestamp');
                
                return new Promise((resolve, reject) => {
                    const backups = [];
                    const request = index.openCursor();
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor) {
                            backups.push({
                                key: cursor.value.key,
                                timestamp: cursor.value.timestamp,
                                date: new Date(cursor.value.timestamp).toLocaleString()
                            });
                            cursor.continue();
                        } else {
                            resolve(backups);
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                return [];
            }
        }

        async function exportDBToJSON() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                
                return new Promise((resolve, reject) => {
                    const allData = [];
                    const request = store.openCursor();
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor) {
                            allData.push(cursor.value);
                            cursor.continue();
                        } else {
                            const exportData = {
                                exportDate: new Date().toISOString(),
                                backups: allData
                            };
                            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `portfolio_backup_${new Date().toISOString().slice(0,19)}.json`;
                            a.click();
                            URL.revokeObjectURL(url);
                            resolve(true);
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                showAlert('Export failed: ' + error.message, 'error');
            }
        }

        async function importJSONToDB(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        const db = await openDB();
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const store = transaction.objectStore(STORE_NAME);
                        
                        for (const backup of data.backups) {
                            await new Promise((res, rej) => {
                                const request = store.put(backup);
                                request.onsuccess = () => res();
                                request.onerror = () => rej(request.error);
                            });
                        }
                        resolve(true);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.readAsText(file);
            });
        }

        // Backup UI Functions
        window.backupToDatabase = async function() {
            const success = await saveAllToDB();
            if (success) {
                showAlert('✅ Data saved to IndexedDB database successfully!');
                loadBackupList();
            } else {
                showAlert('❌ Backup failed!', 'error');
            }
        };

        window.restoreFromDatabase = async function() {
            if (confirm('Restore from database? Current unsaved data will be lost.')) {
                const restored = await loadAllFromDB();
                if (restored) {
                    showAlert('✅ Data restored from database! Refreshing page...');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showAlert('No backup found in database', 'error');
                }
            }
        };

        window.exportDatabase = async function() {
            await exportDBToJSON();
            showAlert('✅ Database exported to JSON file!');
        };

        window.importDatabase = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        await importJSONToDB(file);
                        showAlert('✅ Database imported successfully!');
                        loadBackupList();
                    } catch (error) {
                        showAlert('❌ Import failed: ' + error.message, 'error');
                    }
                }
            };
            input.click();
        };

        async function loadBackupList() {
            const backups = await getBackupHistory();
            const backupList = document.getElementById('backupList');
            if (backupList) {
                if (backups.length === 0) {
                    backupList.innerHTML = '<p>No backups found in IndexedDB</p>';
                } else {
                    backupList.innerHTML = backups.map(b => `
                        <div class="backup-item">
                            <span>📅 ${b.date}</span>
                            <button class="btn-small" onclick="restoreSpecificBackup('${b.key}')">Restore</button>
                        </div>
                    `).join('');
                }
            }
        }

        window.restoreSpecificBackup = async function(key) {
            if (confirm('Restore this backup? Current data will be replaced.')) {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(key);
                request.onsuccess = () => {
                    if (request.result && request.result.data) {
                        const data = request.result.data;
                        for (const [k, v] of Object.entries(data)) {
                            if (!k.startsWith('_')) {
                                localStorage.setItem(k, v);
                            }
                        }
                        showAlert('Backup restored! Refreshing...');
                        setTimeout(() => location.reload(), 1500);
                    }
                };
            }
        };

        // ==================== VISITOR TRACKING ====================
        function initVisitorTracking() {
            const visitors = JSON.parse(localStorage.getItem('website_visitors') || '[]');
            const today = new Date().toDateString();
            const existingToday = visitors.some(v => v.date === today);
            
            if (!existingToday) {
                const newVisitor = {
                    id: Date.now(),
                    city: 'Visitor',
                    country: 'Location',
                    device: getDeviceType(),
                    browser: getBrowser(),
                    date: today,
                    timestamp: new Date().toISOString()
                };
                visitors.push(newVisitor);
                localStorage.setItem('website_visitors', JSON.stringify(visitors));
                localStorage.setItem('total_visitors', visitors.length);
            }
        }

        function getDeviceType() {
            const ua = navigator.userAgent;
            if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return 'Tablet';
            if (/Mobile|iP(hone|od)|Android|BlackBerry|IEMobile|Kindle/i.test(ua)) return 'Mobile';
            return 'Desktop';
        }

        function getBrowser() {
            const ua = navigator.userAgent;
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Edge')) return 'Edge';
            return 'Other';
        }

            const modalBody = document.getElementById('modalBody');
            
            if (type === 'service') {
                const services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
                const item = services[index];
                modalTitle.innerHTML = 'Edit Service';
                modalBody.innerHTML = `<div class="form-group"><label>Icon</label><input type="text" id="editIcon" value="${item.icon}"></div><div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div>`;
            } else if (type === 'project') {
                const projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
                const item = projects[index];
                modalTitle.innerHTML = 'Edit Project';
                modalBody.innerHTML = `<div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div><div class="form-group"><label>Image URL</label><input type="text" id="editImage" value="${item.image || ''}"></div><div class="form-group"><label>Technologies</label><input type="text" id="editTech" value="${(item.technologies || []).join(', ')}"></div>`;
            } else if (type === 'teamwork') {
                const teamwork = JSON.parse(localStorage.getItem('portfolio_teamwork') || '[]');
                const item = teamwork[index];
                modalTitle.innerHTML = 'Edit TeamWork';
                modalBody.innerHTML = `<div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div><div class="form-group"><label>Image URL</label><input type="text" id="editImage" value="${item.image || ''}"></div><div class="form-group"><label>Role</label><input type="text" id="editRole" value="${item.role || ''}"></div>`;
            }
            modal.style.display = 'flex';
        }

        function saveEdit() {
            if (currentEditType === 'service') {
                let services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
                services[currentEditIndex] = { ...services[currentEditIndex], icon: document.getElementById('editIcon').value, title: document.getElementById('editTitle').value, description: document.getElementById('editDesc').value };
                localStorage.setItem('portfolio_services', JSON.stringify(services));
                showAlert('Service updated!');
                renderServices();
            } else if (currentEditType === 'project') {
                let projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
                projects[currentEditIndex] = { ...projects[currentEditIndex], title: document.getElementById('editTitle').value, description: document.getElementById('editDesc').value, image: document.getElementById('editImage').value, technologies: document.getElementById('editTech').value.split(',').map(t => t.trim()) };
                localStorage.setItem('portfolio_projects', JSON.stringify(projects));
                showAlert('Project updated!');
                renderProjects();
            } else if (currentEditType === 'teamwork') {
                let teamwork = JSON.parse(localStorage.getItem('portfolio_teamwork') || '[]');
                teamwork[currentEditIndex] = { ...teamwork[currentEditIndex], title: document.getElementById('editTitle').value, description: document.getElementById('editDesc').value, image: document.getElementById('editImage').value, role: document.getElementById('editRole').value };
                localStorage.setItem('portfolio_teamwork', JSON.stringify(teamwork));
                showAlert('TeamWork updated!');
                renderTeamwork();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditType = null;
            currentEditIndex = null;
        }

        function logout() {
            localStorage.setItem('last_login', new Date().toLocaleString());
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        }

        // Initialize
        if (!localStorage.getItem('last_login')) {
            localStorage.setItem('last_login', new Date().toLocaleString());
        }
        initVisitorTracking();
        showSection('dashboard');
    </script>
</body>
</html>
