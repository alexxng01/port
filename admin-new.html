<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CMS - File Storage Panel</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a2a;
            color: #fff;
        }
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: #1a1a3a;
            padding: 25px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #2d2d4a;
            z-index: 100;
        }
        .sidebar h2 {
            text-align: center;
            color: #0ef;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .sidebar h2 i {
            margin-right: 10px;
        }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            margin: 5px 0;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background: #0ef;
            color: #1a1a3a;
        }
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #1e1e3e, #16213e);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
            border: 1px solid #2d2d4a;
            cursor: pointer;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #0ef;
        }
        .stat-card h3 {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .stat-card p {
            font-size: 32px;
            font-weight: bold;
            color: #0ef;
        }
        .form-container {
            background: #1e1e3e;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #2d2d4a;
        }
        .form-container h3 {
            margin-bottom: 20px;
            color: #0ef;
            font-size: 22px;
            border-bottom: 1px solid #2d2d4a;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0ef;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(90deg, #0ef, #00a3c4);
            color: #1a1a3a;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 238, 255, 0.4);
        }
        .btn-danger {
            background: #ff4757;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-edit {
            background: #ffa502;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        .data-table {
            background: #1e1e3e;
            border-radius: 15px;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid #2d2d4a;
        }
        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2d2d4a;
        }
        .data-table th {
            background: #2a2a4a;
            color: #0ef;
        }
        .skill-item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .skill-item-row input {
            flex: 1;
            padding: 10px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
        }
        .message-card {
            background: #2a2a4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #0ef, #0066cc);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .login-info {
            background: #2a2a4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .visitor-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .visitor-card {
            background: #1e1e3e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #2d2d4a;
        }
        .visitor-card h4 {
            color: #0ef;
            margin-bottom: 15px;
        }
        .visitor-item {
            padding: 10px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            justify-content: space-between;
        }
        .badge {
            background: #0ef;
            color: #1a1a3a;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e3e;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #0ef;
        }
        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 2000;
            animation: slideDown 0.3s ease;
        }
        .alert-success { background: rgba(0, 214, 143, 0.95); color: white; }
        .alert-error { background: rgba(255, 71, 87, 0.95); color: white; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar h2 span, .sidebar nav a span { display: none; }
            .main-content { margin-left: 70px; padding: 15px; }
        }
        .file-info {
            background: #0a0a2a;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar">
            <h2><i class='bx bx-code-alt'></i> <span>Portfolio CMS</span></h2>
            <nav>
                <a onclick="showSection('dashboard')" class="active"><i class='bx bxs-dashboard'></i> <span>Dashboard</span></a>
                <a onclick="showSection('profile')"><i class='bx bxs-user'></i> <span>Profile</span></a>
                <a onclick="showSection('about')"><i class='bx bxs-info-circle'></i> <span>About</span></a>
                <a onclick="showSection('services')"><i class='bx bxs-briefcase'></i> <span>Services</span></a>
                <a onclick="showSection('skills')"><i class='bx bxs-cog'></i> <span>Skills</span></a>
                <a onclick="showSection('projects')"><i class='bx bxs-folder-open'></i> <span>Projects</span></a>
                <a onclick="showSection('teamwork')"><i class='bx bxs-group'></i> <span>TeamWork</span></a>
                <a onclick="showSection('contact')"><i class='bx bxs-envelope'></i> <span>Contact</span></a>
                <a href="index.html" target="_blank"><i class='bx bxs-show'></i> <span>View Site</span></a>
                <a onclick="logout()"><i class='bx bxs-log-out'></i> <span>Logout</span></a>
            </nav>
        </div>
        <div class="main-content" id="mainContent"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Edit Item</h3>
            <div id="modalBody"></div>
            <button class="btn-primary" onclick="saveEdit()" style="margin-top: 15px;">Save Changes</button>
        </div>
    </div>

    <script>
        // Check login
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        // API URL
        const API_URL = 'save-data.php';

        let currentEditType = null;
        let currentEditIndex = null;
        let fileStatus = 'checking';

        const currentAdmin = JSON.parse(localStorage.getItem('admin_account')) || {};
        
        // Helper functions
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class='bx bx-${type === 'success' ? 'check-circle' : 'error'}'></i> ${message}`;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function getGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) return 'Good Morning';
            if (hour < 18) return 'Good Afternoon';
            return 'Good Evening';
        }

        function updateDateTime() {
            const now = new Date();
            return {
                time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                date: now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
            };
        }

        // ==================== FILE STORAGE FUNCTIONS ====================
        
        async function saveAllToFile() {
            showAlert('Saving all data to file...', 'success');
            
            const allData = {};
            const sections = ['portfolio_profile', 'portfolio_about', 'portfolio_services', 
                             'portfolio_skills_technical', 'portfolio_skills_professional', 
                             'portfolio_projects', 'portfolio_teamwork', 'contact_messages', 
                             'website_visitors', 'admin_account'];
            
            for (const section of sections) {
                const value = localStorage.getItem(section);
                if (value) {
                    allData[section] = JSON.parse(value);
                }
            }
            
            try {
                const response = await fetch(`${API_URL}?path=all`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(allData)
                });
                const result = await response.json();
                if (result.success) {
                    showAlert('✅ All data saved to portfolio_data.json file!');
                    checkFileStatus();
                    return true;
                }
            } catch (error) {
                showAlert('❌ Failed to save to file: ' + error.message, 'error');
            }
            return false;
        }

        async function loadAllFromFile() {
            showAlert('Loading data from file...', 'success');
            
            try {
                const response = await fetch(`${API_URL}?path=all`);
                const data = await response.json();
                
                let loadCount = 0;
                for (const [key, value] of Object.entries(data)) {
                    if (key !== 'last_updated' && value && typeof value === 'object') {
                        localStorage.setItem(key, JSON.stringify(value));
                        loadCount++;
                    }
                }
                
                showAlert(`✅ Loaded ${loadCount} sections from portfolio_data.json! Refreshing...`);
                setTimeout(() => location.reload(), 1500);
            } catch (error) {
                showAlert('❌ Failed to load from file: ' + error.message, 'error');
            }
        }

        async function exportBackup() {
            try {
                window.open(`${API_URL}?path=backup`, '_blank');
                showAlert('✅ Backup file downloaded!');
            } catch (error) {
                showAlert('❌ Backup failed: ' + error.message, 'error');
            }
        }

        function restoreBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = async function(event) {
                        try {
                            const response = await fetch(`${API_URL}?path=backup`, {
                                method: 'POST',
                                body: event.target.result
                            });
                            const result = await response.json();
                            if (result.success) {
                                showAlert('✅ Backup restored! Refreshing...');
                                setTimeout(() => location.reload(), 1500);
                            }
                        } catch (error) {
                            showAlert('❌ Restore failed: ' + error.message, 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        async function checkFileStatus() {
            try {
                const response = await fetch(`${API_URL}?path=ping`);
                const data = await response.json();
                fileStatus = 'online';
                document.getElementById('fileStatus')?.setAttribute('class', 'badge');
                document.getElementById('fileStatusText')?.setAttribute('class', 'badge');
                if (document.getElementById('fileStatusText')) {
                    document.getElementById('fileStatusText').innerHTML = '✅ Connected';
                }
                return true;
            } catch (error) {
                fileStatus = 'offline';
                if (document.getElementById('fileStatusText')) {
                    document.getElementById('fileStatusText').innerHTML = '⚠️ Offline (Using LocalStorage)';
                }
                return false;
            }
        }

        // ==================== INITIALIZE DATA ====================
        function initLocalData() {
            if (!localStorage.getItem('portfolio_profile')) {
                localStorage.setItem('portfolio_profile', JSON.stringify({
                    name: 'Rahul Mahato',
                    title: 'Full Stack Developer',
                    bio: 'I\'m a web Designer with extensive experience.',
                    image: './images/ME.jpeg',
                    cv: 'cv/cv-3.docx',
                    email: 'rm91275@gmail.com',
                    phone: '+977 98XXXXXXXX',
                    address: 'Kathmandu, Nepal'
                }));
            }
            if (!localStorage.getItem('admin_account')) {
                localStorage.setItem('admin_account', JSON.stringify({
                    email: 'rm91275@gmail.com',
                    password: 'Admin@123',
                    name: 'Rahul Mahato'
                }));
            }
            if (!localStorage.getItem('portfolio_about')) {
                localStorage.setItem('portfolio_about', JSON.stringify({
                    mainText: 'Full Stack Developer',
                    paragraphs: [
                        "I'm a Computer Science student at Techspire College in Kathmandu, Nepal.",
                        "My journey in technology started with curiosity about how things work.",
                        "When I'm not coding, you can find me exploring new design trends."
                    ]
                }));
            }
            if (!localStorage.getItem('portfolio_services')) {
                localStorage.setItem('portfolio_services', JSON.stringify([
                    { id: 1, icon: 'bx bx-code', title: 'Web Development', description: 'Modern responsive websites.' },
                    { id: 2, icon: 'bx bx-crop', title: 'UI/UX Design', description: 'Beautiful interfaces.' },
                    { id: 3, icon: 'bx bxl-apple', title: 'App Design', description: 'Mobile-first design.' }
                ]));
            }
            if (!localStorage.getItem('portfolio_skills_technical')) {
                localStorage.setItem('portfolio_skills_technical', JSON.stringify([
                    { id: 1, name: 'HTML5', level: 90, icon: 'bx bxl-html5' },
                    { id: 2, name: 'CSS3', level: 85, icon: 'bx bxl-css3' },
                    { id: 3, name: 'JavaScript', level: 80, icon: 'bx bxl-javascript' },
                    { id: 4, name: 'React', level: 75, icon: 'bx bxl-react' }
                ]));
            }
            if (!localStorage.getItem('portfolio_skills_professional')) {
                localStorage.setItem('portfolio_skills_professional', JSON.stringify([
                    { id: 1, name: 'Creativity', level: 90 },
                    { id: 2, name: 'Communication', level: 65 },
                    { id: 3, name: 'Problem Solving', level: 85 },
                    { id: 4, name: 'Team Work', level: 89 }
                ]));
            }
            if (!localStorage.getItem('portfolio_projects')) {
                localStorage.setItem('portfolio_projects', JSON.stringify([
                    { id: 1, title: 'E-Commerce Dashboard', description: 'Modern admin dashboard.', image: 'images/E-comerce.png', technologies: ['React', 'Node.js'] },
                    { id: 2, title: 'Task Management App', description: 'Collaborative task management.', image: 'images/task-management.png', technologies: ['Vue.js', 'Express'] },
                    { id: 3, title: 'Portfolio Website', description: 'Responsive portfolio website.', image: 'images/website.png', technologies: ['HTML', 'CSS', 'JS'] }
                ]));
            }
            if (!localStorage.getItem('portfolio_teamwork')) {
                localStorage.setItem('portfolio_teamwork', JSON.stringify([
                    { id: 1, title: 'Open Source Contribution', description: 'Collaborated with global developers.', image: '', role: 'Contributor' },
                    { id: 2, title: 'Hackathon Winner', description: 'First place at college hackathon.', image: '', role: 'Team Lead' }
                ]));
            }
            if (!localStorage.getItem('contact_messages')) {
                localStorage.setItem('contact_messages', JSON.stringify([]));
            }
            if (!localStorage.getItem('website_visitors')) {
                localStorage.setItem('website_visitors', JSON.stringify([]));
            }
        }
        initLocalData();

        // ==================== RENDER FUNCTIONS ====================
        function showSection(section) {
            const links = document.querySelectorAll('.sidebar nav a');
            links.forEach(link => link.classList.remove('active'));
            if (event && event.target) {
                event.target.closest('a').classList.add('active');
            }
            
            const content = document.getElementById('mainContent');
            switch(section) {
                case 'dashboard': content.innerHTML = renderDashboard(); checkFileStatus(); break;
                case 'profile': content.innerHTML = renderProfile(); break;
                case 'about': content.innerHTML = renderAbout(); break;
                case 'services': content.innerHTML = renderServices(); break;
                case 'skills': content.innerHTML = renderSkills(); break;
                case 'projects': content.innerHTML = renderProjects(); break;
                case 'teamwork': content.innerHTML = renderTeamwork(); break;
                case 'contact': content.innerHTML = renderContactMessages(); break;
                default: content.innerHTML = renderDashboard();
            }
        }

        function renderDashboard() {
            const profile = JSON.parse(localStorage.getItem('portfolio_profile') || '{}');
            const services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
            const projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
            const messages = JSON.parse(localStorage.getItem('contact_messages') || '[]');
            const visitors = JSON.parse(localStorage.getItem('website_visitors') || '[]');
            const dateTime = updateDateTime();
            const greeting = getGreeting();
            const adminName = currentAdmin.name || profile.name || 'Admin';
            
            return `
                <div class="welcome-banner">
                    <div class="welcome-text">
                        <h3><i class='bx bx-smile'></i> ${greeting}, ${adminName}!</h3>
                        <p>Welcome to File-Based Portfolio CMS</p>
                    </div>
                    <div class="date-time">
                        <div class="time">${dateTime.time}</div>
                        <div class="date">${dateTime.date}</div>
                    </div>
                </div>

                <div class="login-info">
                    <div><i class='bx bx-user-circle'></i> <strong>Logged in as:</strong> ${adminName}</div>
                    <div><i class='bx bx-envelope'></i> <strong>Email:</strong> ${currentAdmin.email || profile.email}</div>
                    <div><i class='bx bx-file'></i> <strong>File Storage:</strong> <span id="fileStatusText">Checking...</span></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card" onclick="showSection('profile')"><h3>Profile</h3><p>✅</p><small>${profile.name}</small></div>
                    <div class="stat-card" onclick="showSection('services')"><h3>Services</h3><p>${services.length}</p></div>
                    <div class="stat-card" onclick="showSection('projects')"><h3>Projects</h3><p>${projects.length}</p></div>
                    <div class="stat-card" onclick="showSection('contact')"><h3>Messages</h3><p>${messages.length}</p></div>
                    <div class="stat-card"><h3>Visitors</h3><p>${visitors.length}</p></div>
                </div>

                <div class="form-container">
                    <h3><i class='bx bx-file'></i> File Storage System (portfolio_data.json)</h3>
                    <p>Your data is stored in a JSON file on the server. This file persists after deployment!</p>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin: 20px 0;">
                        <button class="btn-primary" onclick="saveAllToFile()"><i class='bx bx-save'></i> Save to File</button>
                        <button class="btn-primary" onclick="loadAllFromFile()"><i class='bx bx-folder-open'></i> Load from File</button>
                        <button class="btn-primary" onclick="exportBackup()"><i class='bx bx-download'></i> Download Backup</button>
                        <button class="btn-primary" onclick="restoreBackup()"><i class='bx bx-upload'></i> Restore Backup</button>
                    </div>
                    <div class="file-info">
                        <i class='bx bx-info-circle'></i> <strong>File Location:</strong> /portfolio_data.json<br>
                        <i class='bx bx-check-circle'></i> <strong>Data Persistence:</strong> Data saved to file survives server restarts and deployments!
                    </div>
                </div>

                <div class="visitor-stats">
                    <div class="visitor-card">
                        <h4><i class='bx bx-map'></i> Recent Visitors</h4>
                        <div class="visitor-list">
                            ${visitors.slice(-5).reverse().map(v => `
                                <div class="visitor-item">
                                    <span>${v.city || 'Unknown'}, ${v.country || 'Unknown'}</span>
                                    <span class="badge">${v.device || 'Desktop'}</span>
                                </div>
                            `).join('') || '<p>No visitors yet</p>'}
                        </div>
                    </div>
                </div>

                <div class="form-container">
                    <h3><i class='bx bx-info-circle'></i> System Information</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        <div><strong>📄 Storage Type:</strong> JSON File</div>
                        <div><strong>💾 LocalStorage Used:</strong> ${Math.round(JSON.stringify(localStorage).length / 1024)} KB</div>
                        <div><strong>📁 File Name:</strong> portfolio_data.json</div>
                        <div><strong>🔄 Auto-Save:</strong> Manual</div>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            const profile = JSON.parse(localStorage.getItem('portfolio_profile') || '{}');
            const admin = JSON.parse(localStorage.getItem('admin_account') || '{}');
            return `
                <div class="form-container">
                    <h3><i class='bx bx-user-edit'></i> Edit Profile</h3>
                    <div class="form-group"><label>Full Name</label><input type="text" id="profileName" value="${escapeHtml(profile.name || '')}"></div>
                    <div class="form-group"><label>Title</label><input type="text" id="profileTitle" value="${escapeHtml(profile.title || '')}"></div>
                    <div class="form-group"><label>Bio</label><textarea id="profileBio" rows="4">${escapeHtml(profile.bio || '')}</textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="profileImage" value="${profile.image || ''}"></div>
                    <div class="form-group"><label>CV URL</label><input type="text" id="profileCV" value="${profile.cv || ''}"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="profileEmail" value="${admin.email || profile.email || ''}"></div>
                    <div class="form-group"><label>Phone</label><input type="text" id="profilePhone" value="${profile.phone || ''}"></div>
                    <div class="form-group"><label>Address</label><input type="text" id="profileAddress" value="${profile.address || ''}"></div>
                    <div class="form-group"><label>New Password</label><input type="password" id="profilePassword" placeholder="Leave blank to keep current"></div>
                    <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
                    <button class="btn-primary" onclick="saveAllToFile()" style="margin-left: 10px;">Save to File</button>
                </div>
            `;
        }

        function saveProfile() {
            const profile = {
                name: document.getElementById('profileName').value,
                title: document.getElementById('profileTitle').value,
                bio: document.getElementById('profileBio').value,
                image: document.getElementById('profileImage').value,
                cv: document.getElementById('profileCV').value,
                email: document.getElementById('profileEmail').value,
                phone: document.getElementById('profilePhone').value,
                address: document.getElementById('profileAddress').value
            };
            localStorage.setItem('portfolio_profile', JSON.stringify(profile));
            
            const admin = JSON.parse(localStorage.getItem('admin_account') || '{}');
            admin.email = profile.email;
            const newPassword = document.getElementById('profilePassword').value;
            if (newPassword && newPassword.length >= 6) {
                admin.password = newPassword;
            }
            localStorage.setItem('admin_account', JSON.stringify(admin));
            showAlert('Profile saved to LocalStorage! Click "Save to File" to persist.');
        }

        function renderAbout() {
            const about = JSON.parse(localStorage.getItem('portfolio_about') || '{}');
            const paragraphs = about.paragraphs || ['', '', ''];
            return `
                <div class="form-container">
                    <h3>Edit About Section</h3>
                    <div class="form-group"><label>Subtitle</label><input type="text" id="aboutSubtitle" value="${escapeHtml(about.mainText || '')}"></div>
                    <div class="form-group"><label>Paragraph 1</label><textarea id="aboutPara1" rows="3">${escapeHtml(paragraphs[0] || '')}</textarea></div>
                    <div class="form-group"><label>Paragraph 2</label><textarea id="aboutPara2" rows="3">${escapeHtml(paragraphs[1] || '')}</textarea></div>
                    <div class="form-group"><label>Paragraph 3</label><textarea id="aboutPara3" rows="3">${escapeHtml(paragraphs[2] || '')}</textarea></div>
                    <button class="btn-primary" onclick="saveAbout()">Save About</button>
                </div>
            `;
        }

        function saveAbout() {
            const about = {
                mainText: document.getElementById('aboutSubtitle').value,
                paragraphs: [
                    document.getElementById('aboutPara1').value,
                    document.getElementById('aboutPara2').value,
                    document.getElementById('aboutPara3').value
                ]
            };
            localStorage.setItem('portfolio_about', JSON.stringify(about));
            showAlert('About section saved!');
        }

        function renderServices() {
            let services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
            return `
                <div class="form-container">
                    <h3>Add New Service</h3>
                    <div class="form-group"><label>Icon</label><input type="text" id="newServiceIcon" value="bx bx-code"></div>
                    <div class="form-group"><label>Title</label><input type="text" id="newServiceTitle"></div>
                    <div class="form-group"><label>Description</label><textarea id="newServiceDesc" rows="3"></textarea></div>
                    <button class="btn-primary" onclick="addService()">+ Add Service</button>
                </div>
                <div class="data-table"><h3>Services (${services.length})</h3><table><thead><tr><th>Icon</th><th>Title</th><th>Description</th><th>Actions</th></tr></thead><tbody>${services.map((s, i) => `<tr><td><i class='${s.icon}' style="font-size:24px;color:#0ef;"></i></td><td><strong>${escapeHtml(s.title)}</strong></td><td>${escapeHtml(s.description.substring(0, 80))}...</td><td><button class="btn-edit" onclick="openEditModal('service', ${i})">Edit</button><button class="btn-danger" onclick="deleteService(${i})">Delete</button></td></tr>`).join('')}</tbody></table></div>
            `;
        }

        function addService() {
            const services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
            const title = document.getElementById('newServiceTitle').value;
            const desc = document.getElementById('newServiceDesc').value;
            if (!title || !desc) { showAlert('Please fill all fields!', 'error'); return; }
            services.push({ id: Date.now(), icon: document.getElementById('newServiceIcon').value, title: title, description: desc });
            localStorage.setItem('portfolio_services', JSON.stringify(services));
            showAlert('Service added!');
            renderServices();
        }

        function deleteService(index) {
            if (confirm('Delete this service?')) {
                let services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
                services.splice(index, 1);
                localStorage.setItem('portfolio_services', JSON.stringify(services));
                showAlert('Service deleted!');
                renderServices();
            }
        }

        function renderSkills() {
            const technical = JSON.parse(localStorage.getItem('portfolio_skills_technical') || '[]');
            const professional = JSON.parse(localStorage.getItem('portfolio_skills_professional') || '[]');
            return `
                <div class="form-container"><h3>Technical Skills</h3>
                    ${technical.map((s, i) => `<div class="skill-item-row"><input type="text" id="techName${i}" value="${escapeHtml(s.name)}"><input type="number" id="techLevel${i}" value="${s.level}" style="width:100px;"><button class="btn-edit" onclick="updateTechnicalSkill(${i})">Save</button><button class="btn-danger" onclick="deleteTechnicalSkill(${i})">Delete</button></div>`).join('')}
                    <div style="margin-top:20px;"><h4>Add Technical Skill</h4><div class="skill-item-row"><input type="text" id="newTechName" placeholder="Skill name"><input type="number" id="newTechLevel" placeholder="Level"><button class="btn-primary" onclick="addTechnicalSkill()">Add</button></div></div>
                </div>
                <div class="form-container"><h3>Professional Skills</h3>
                    ${professional.map((s, i) => `<div class="skill-item-row"><input type="text" id="profName${i}" value="${escapeHtml(s.name)}"><input type="number" id="profLevel${i}" value="${s.level}" style="width:100px;"><button class="btn-edit" onclick="updateProfessionalSkill(${i})">Save</button><button class="btn-danger" onclick="deleteProfessionalSkill(${i})">Delete</button></div>`).join('')}
                    <div style="margin-top:20px;"><h4>Add Professional Skill</h4><div class="skill-item-row"><input type="text" id="newProfName" placeholder="Skill name"><input type="number" id="newProfLevel" placeholder="Level"><button class="btn-primary" onclick="addProfessionalSkill()">Add</button></div></div>
                </div>
            `;
        }

        function addTechnicalSkill() {
            const skills = JSON.parse(localStorage.getItem('portfolio_skills_technical') || '[]');
            const name = document.getElementById('newTechName')?.value;
            const level = parseInt(document.getElementById('newTechLevel')?.value);
            if (!name || isNaN(level)) { showAlert('Enter name and level!', 'error'); return; }
            skills.push({ id: Date.now(), name: name, level: level, icon: 'bx bx-code' });
            localStorage.setItem('portfolio_skills_technical', JSON.stringify(skills));
            showAlert('Technical skill added!');
            renderSkills();
        }

        function deleteTechnicalSkill(index) {
            if (confirm('Delete this skill?')) {
                let skills = JSON.parse(localStorage.getItem('portfolio_skills_technical') || '[]');
                skills.splice(index, 1);
                localStorage.setItem('portfolio_skills_technical', JSON.stringify(skills));
                showAlert('Skill deleted!');
                renderSkills();
            }
        }

        function updateTechnicalSkill(index) {
            let skills = JSON.parse(localStorage.getItem('portfolio_skills_technical') || '[]');
            skills[index].name = document.getElementById(`techName${index}`).value;
            skills[index].level = parseInt(document.getElementById(`techLevel${index}`).value);
            localStorage.setItem('portfolio_skills_technical', JSON.stringify(skills));
            showAlert('Technical skill updated!');
            renderSkills();
        }

        function addProfessionalSkill() {
            const skills = JSON.parse(localStorage.getItem('portfolio_skills_professional') || '[]');
            const name = document.getElementById('newProfName')?.value;
            const level = parseInt(document.getElementById('newProfLevel')?.value);
            if (!name || isNaN(level)) { showAlert('Enter name and level!', 'error'); return; }
            skills.push({ id: Date.now(), name: name, level: level });
            localStorage.setItem('portfolio_skills_professional', JSON.stringify(skills));
            showAlert('Professional skill added!');
            renderSkills();
        }

        function deleteProfessionalSkill(index) {
            if (confirm('Delete this skill?')) {
                let skills = JSON.parse(localStorage.getItem('portfolio_skills_professional') || '[]');
                skills.splice(index, 1);
                localStorage.setItem('portfolio_skills_professional', JSON.stringify(skills));
                showAlert('Skill deleted!');
                renderSkills();
            }
        }

        function updateProfessionalSkill(index) {
            let skills = JSON.parse(localStorage.getItem('portfolio_skills_professional') || '[]');
            skills[index].name = document.getElementById(`profName${index}`).value;
            skills[index].level = parseInt(document.getElementById(`profLevel${index}`).value);
            localStorage.setItem('portfolio_skills_professional', JSON.stringify(skills));
            showAlert('Professional skill updated!');
            renderSkills();
        }

        function renderProjects() {
            let projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
            return `
                <div class="form-container"><h3>Add New Project</h3>
                    <div class="form-group"><label>Title</label><input type="text" id="newProjectTitle"></div>
                    <div class="form-group"><label>Description</label><textarea id="newProjectDesc" rows="3"></textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="newProjectImage"></div>
                    <div class="form-group"><label>Technologies</label><input type="text" id="newProjectTech" placeholder="React, Node.js"></div>
                    <button class="btn-primary" onclick="addProject()">+ Add Project</button>
                </div>
                <div class="data-table"><h3>Projects (${projects.length})</h3><table><thead><tr><th>Title</th><th>Technologies</th><th>Actions</th></tr></thead><tbody>${projects.map((p, i) => `<tr><td><strong>${escapeHtml(p.title)}</strong></td><td>${(p.technologies || []).join(', ')}</td><td><button class="btn-edit" onclick="openEditModal('project', ${i})">Edit</button><button class="btn-danger" onclick="deleteProject(${i})">Delete</button></td></tr>`).join('')}</tbody></table></div>
            `;
        }

        function addProject() {
            const projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
            const title = document.getElementById('newProjectTitle').value;
            const desc = document.getElementById('newProjectDesc').value;
            if (!title || !desc) { showAlert('Please fill title and description!', 'error'); return; }
            projects.push({ id: Date.now(), title: title, description: desc, image: document.getElementById('newProjectImage').value, technologies: document.getElementById('newProjectTech').value.split(',').map(t => t.trim()) });
            localStorage.setItem('portfolio_projects', JSON.stringify(projects));
            showAlert('Project added!');
            renderProjects();
        }

        function deleteProject(index) {
            if (confirm('Delete this project?')) {
                let projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
                projects.splice(index, 1);
                localStorage.setItem('portfolio_projects', JSON.stringify(projects));
                showAlert('Project deleted!');
                renderProjects();
            }
        }

        function renderTeamwork() {
            let teamwork = JSON.parse(localStorage.getItem('portfolio_teamwork') || '[]');
            return `
                <div class="form-container"><h3>Add TeamWork Entry</h3>
                    <div class="form-group"><label>Title</label><input type="text" id="newTeamTitle"></div>
                    <div class="form-group"><label>Description</label><textarea id="newTeamDesc" rows="3"></textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="newTeamImage"></div>
                    <div class="form-group"><label>Role</label><input type="text" id="newTeamRole"></div>
                    <button class="btn-primary" onclick="addTeamwork()">+ Add TeamWork</button>
                </div>
                <div class="data-table"><h3>TeamWork (${teamwork.length})</h3><table><thead><tr><th>Title</th><th>Role</th><th>Description</th><th>Actions</th></tr></thead><tbody>${teamwork.map((t, i) => `<tr><td><strong>${escapeHtml(t.title)}</strong></td><td>${t.role || 'Member'}</td><td>${escapeHtml(t.description.substring(0, 60))}...</td><td><button class="btn-edit" onclick="openEditModal('teamwork', ${i})">Edit</button><button class="btn-danger" onclick="deleteTeamwork(${i})">Delete</button></td></tr>`).join('')}</tbody></table></div>
            `;
        }

        function addTeamwork() {
            const teamwork = JSON.parse(localStorage.getItem('portfolio_teamwork') || '[]');
            const title = document.getElementById('newTeamTitle').value;
            const desc = document.getElementById('newTeamDesc').value;
            if (!title || !desc) { showAlert('Please fill title and description!', 'error'); return; }
            teamwork.push({ id: Date.now(), title: title, description: desc, image: document.getElementById('newTeamImage').value, role: document.getElementById('newTeamRole').value });
            localStorage.setItem('portfolio_teamwork', JSON.stringify(teamwork));
            showAlert('TeamWork added!');
            renderTeamwork();
        }

        function deleteTeamwork(index) {
            if (confirm('Delete this teamwork entry?')) {
                let teamwork = JSON.parse(localStorage.getItem('portfolio_teamwork') || '[]');
                teamwork.splice(index, 1);
                localStorage.setItem('portfolio_teamwork', JSON.stringify(teamwork));
                showAlert('TeamWork deleted!');
                renderTeamwork();
            }
        }

        function renderContactMessages() {
            const messages = JSON.parse(localStorage.getItem('contact_messages') || '[]');
            return `<div class="form-container"><h3>Contact Messages (${messages.length})</h3>${messages.length === 0 ? '<p style="text-align:center;padding:40px;">No messages yet.</p>' : messages.slice().reverse().map(msg => `<div class="message-card"><h4><i class="bx bxs-user"></i> ${escapeHtml(msg.name)}</h4><p><i class="bx bxs-envelope"></i> ${escapeHtml(msg.email)}</p><div class="message-date">${new Date(msg.date).toLocaleString()}</div><p><strong>Message:</strong> ${escapeHtml(msg.message)}</p><button class="btn-danger" onclick="deleteMessage(${msg.id})">Delete</button></div>`).join('')}</div>`;
        }

        function deleteMessage(id) {
            if (confirm('Delete this message?')) {
                let messages = JSON.parse(localStorage.getItem('contact_messages') || '[]');
                messages = messages.filter(msg => msg.id !== id);
                localStorage.setItem('contact_messages', JSON.stringify(messages));
                showAlert('Message deleted!');
                renderContactMessages();
            }
        }

        // Modal functions
        function openEditModal(type, index) {
            currentEditType = type;
            currentEditIndex = index;
            const modal = document.getElementById('editModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            if (type === 'service') {
                const services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
                const item = services[index];
                modalTitle.innerHTML = 'Edit Service';
                modalBody.innerHTML = `<div class="form-group"><label>Icon</label><input type="text" id="editIcon" value="${item.icon}"></div><div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div>`;
            } else if (type === 'project') {
                const projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
                const item = projects[index];
                modalTitle.innerHTML = 'Edit Project';
                modalBody.innerHTML = `<div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div><div class="form-group"><label>Image URL</label><input type="text" id="editImage" value="${item.image || ''}"></div><div class="form-group"><label>Technologies</label><input type="text" id="editTech" value="${(item.technologies || []).join(', ')}"></div>`;
            } else if (type === 'teamwork') {
                const teamwork = JSON.parse(localStorage.getItem('portfolio_teamwork') || '[]');
                const item = teamwork[index];
                modalTitle.innerHTML = 'Edit TeamWork';
                modalBody.innerHTML = `<div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div><div class="form-group"><label>Image URL</label><input type="text" id="editImage" value="${item.image || ''}"></div><div class="form-group"><label>Role</label><input type="text" id="editRole" value="${item.role || ''}"></div>`;
            }
            modal.style.display = 'flex';
        }

        function saveEdit() {
            if (currentEditType === 'service') {
                let services = JSON.parse(localStorage.getItem('portfolio_services') || '[]');
                services[currentEditIndex] = { ...services[currentEditIndex], icon: document.getElementById('editIcon').value, title: document.getElementById('editTitle').value, description: document.getElementById('editDesc').value };
                localStorage.setItem('portfolio_services', JSON.stringify(services));
                showAlert('Service updated!');
                renderServices();
            } else if (currentEditType === 'project') {
                let projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
                projects[currentEditIndex] = { ...projects[currentEditIndex], title: document.getElementById('editTitle').value, description: document.getElementById('editDesc').value, image: document.getElementById('editImage').value, technologies: document.getElementById('editTech').value.split(',').map(t => t.trim()) };
                localStorage.setItem('portfolio_projects', JSON.stringify(projects));
                showAlert('Project updated!');
                renderProjects();
            } else if (currentEditType === 'teamwork') {
                let teamwork = JSON.parse(localStorage.getItem('portfolio_teamwork') || '[]');
                teamwork[currentEditIndex] = { ...teamwork[currentEditIndex], title: document.getElementById('editTitle').value, description: document.getElementById('editDesc').value, image: document.getElementById('editImage').value, role: document.getElementById('editRole').value };
                localStorage.setItem('portfolio_teamwork', JSON.stringify(teamwork));
                showAlert('TeamWork updated!');
                renderTeamwork();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditType = null;
            currentEditIndex = null;
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        }

        // Make functions global
        window.showSection = showSection;
        window.saveProfile = saveProfile;
        window.saveAbout = saveAbout;
        window.addService = addService;
        window.deleteService = deleteService;
        window.openEditModal = openEditModal;
        window.saveEdit = saveEdit;
        window.closeModal = closeModal;
        window.logout = logout;
        window.saveAllToFile = saveAllToFile;
        window.loadAllFromFile = loadAllFromFile;
        window.exportBackup = exportBackup;
        window.restoreBackup = restoreBackup;
        window.addTechnicalSkill = addTechnicalSkill;
        window.deleteTechnicalSkill = deleteTechnicalSkill;
        window.updateTechnicalSkill = updateTechnicalSkill;
        window.addProfessionalSkill = addProfessionalSkill;
        window.deleteProfessionalSkill = deleteProfessionalSkill;
        window.updateProfessionalSkill = updateProfessionalSkill;
        window.addProject = addProject;
        window.deleteProject = deleteProject;
        window.addTeamwork = addTeamwork;
        window.deleteTeamwork = deleteTeamwork;
        window.deleteMessage = deleteMessage;

        showSection('dashboard');
        checkFileStatus();
    </script>
</body>
</html>
