<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Portfolio CMS</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #071b27);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .forgot-container {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 30px rgba(0, 238, 255, 0.2);
            border: 1px solid #0ef;
        }
        .forgot-container h2 {
            text-align: center;
            color: #0ef;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0ef;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0ef;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0ef, #00a3c4);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 238, 255, 0.4);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #0ef;
            text-decoration: none;
        }
        .error-msg, .success-msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .error-msg {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
        }
        .success-msg {
            background: rgba(0, 214, 143, 0.2);
            border: 1px solid #00d68f;
            color: #00d68f;
        }
        .info-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #8899aa;
        }
        .registered-email {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        .registered-email span {
            color: #0ef;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <h2><i class='bx bx-key'></i> Forgot Password</h2>
        
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        
        <div class="registered-email" id="registeredEmailDisplay">
            <i class='bx bx-info-circle'></i> Registered Email: <span id="displayEmail">Loading...</span>
        </div>
        
        <form id="forgotForm" onsubmit="sendOTP(event)">
            <div class="form-group">
                <label><i class='bx bx-envelope'></i> Enter Your Email</label>
                <input type="email" id="email" placeholder="Enter your registered email" required>
            </div>
            <button type="submit" class="btn-primary" id="sendBtn"><i class='bx bx-send'></i> Send OTP</button>
        </form>
        
        <div class="back-link">
            <a href="login.html"><i class='bx bx-arrow-back'></i> Back to Login</a>
        </div>
        
        <div class="info-text">
            <i class='bx bx-info-circle'></i> OTP will be shown in a popup for demo purposes
        </div>
    </div>

    <script>
        // Display registered email on page load
        function displayRegisteredEmail() {
            const adminAccount = JSON.parse(localStorage.getItem('admin_account'));
            if (adminAccount && adminAccount.email) {
                document.getElementById('displayEmail').innerText = adminAccount.email;
            } else {
                // If no admin account exists, create default
                const defaultAccount = {
                    email: 'rm91275@gmail.com',
                    password: 'Admin@123',
                    name: 'Rahul Mahato'
                };
                localStorage.setItem('admin_account', JSON.stringify(defaultAccount));
                document.getElementById('displayEmail').innerText = 'rm91275@gmail.com';
            }
        }

        // Also update profile email to match
        function syncProfileEmail() {
            const adminAccount = JSON.parse(localStorage.getItem('admin_account'));
            if (adminAccount && adminAccount.email) {
                const profile = JSON.parse(localStorage.getItem('portfolio_profile')) || {};
                profile.email = adminAccount.email;
                localStorage.setItem('portfolio_profile', JSON.stringify(profile));
            }
        }

        let storedOTP = null;
        let verifiedEmail = null;

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerHTML = '<i class="bx bx-error"></i> ' + message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.innerHTML = '<i class="bx bx-check-circle"></i> ' + message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }

        function sendOTP(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const adminAccount = JSON.parse(localStorage.getItem('admin_account'));
            
            console.log('Entered email:', email);
            console.log('Registered admin email:', adminAccount.email);
            
            // Check if email matches registered admin email
            if (email !== adminAccount.email) {
                showError(`Email not found! Please use: ${adminAccount.email}`);
                return;
            }
            
            // Generate 6-digit OTP
            const otp = Math.floor(100000 + Math.random() * 900000).toString();
            storedOTP = otp;
            verifiedEmail = email;
            
            console.log('Your OTP is:', otp);
            
            // Show OTP in popup
            showOTPInPopup(otp, email);
        }
        
        function showOTPInPopup(otp, email) {
            // Create custom OTP display
            const otpDisplay = document.createElement('div');
            otpDisplay.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #1e293b;
                border: 2px solid #0ef;
                border-radius: 15px;
                padding: 30px;
                text-align: center;
                z-index: 1000;
                box-shadow: 0 0 50px rgba(0,238,255,0.5);
            `;
            otpDisplay.innerHTML = `
                <h3 style="color:#0ef; margin-bottom:20px;"><i class='bx bx-envelope'></i> OTP Sent!</h3>
                <p style="margin-bottom:15px;">Your OTP for <strong>${email}</strong> is:</p>
                <div style="font-size:48px; font-weight:bold; color:#0ef; letter-spacing:10px; margin:20px 0;">${otp}</div>
                <p style="margin-bottom:20px;">This OTP will expire in 5 minutes.</p>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <input type="text" id="otpInput" placeholder="Enter OTP" style="padding:10px; border-radius:8px; border:none; width:150px;">
                    <button onclick="verifyOTPFromPopup('${otp}')" style="background:#0ef; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold;">Verify</button>
                    <button onclick="this.parentElement.parentElement.remove()" style="background:#ff4757; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; color:white;">Close</button>
                </div>
            `;
            document.body.appendChild(otpDisplay);
            
            showSuccess('OTP has been sent! Check the popup window.');
            
            // Auto-expire OTP after 5 minutes
            setTimeout(() => {
                if (storedOTP === otp) {
                    storedOTP = null;
                    showError('OTP expired! Please request a new one.');
                }
                if (otpDisplay) otpDisplay.remove();
            }, 300000);
        }
        
        window.verifyOTPFromPopup = function(otp) {
            const enteredOTP = document.getElementById('otpInput')?.value;
            if (enteredOTP === otp) {
                // Close popup
                document.querySelector('div[style*="position: fixed"]')?.remove();
                // Show password reset form
                showPasswordResetForm();
            } else {
                alert('Invalid OTP! Please try again.');
            }
        }
        
        function showPasswordResetForm() {
            const container = document.querySelector('.forgot-container');
            const form = document.getElementById('forgotForm');
            const registeredDiv = document.querySelector('.registered-email');
            
            form.style.display = 'none';
            if (registeredDiv) registeredDiv.style.display = 'none';
            
            const resetForm = document.createElement('div');
            resetForm.id = 'resetFormSection';
            resetForm.innerHTML = `
                <div style="margin-top: 20px;">
                    <h3 style="color:#0ef; margin-bottom:20px;">Reset Password</h3>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    </div>
                    <button class="btn-primary" onclick="resetPassword()">Reset Password</button>
                    <button class="btn-primary" onclick="location.reload()" style="margin-top:10px; background:#334155;">Cancel</button>
                </div>
            `;
            container.appendChild(resetForm);
        }
        
        window.resetPassword = function() {
            const newPassword = document.getElementById('newPassword')?.value;
            const confirmPassword = document.getElementById('confirmPassword')?.value;
            
            if (!newPassword || newPassword.length < 6) {
                showError('Password must be at least 6 characters!');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showError('Passwords do not match!');
                return;
            }
            
            // Update password in localStorage
            const adminAccount = JSON.parse(localStorage.getItem('admin_account'));
            adminAccount.password = newPassword;
            localStorage.setItem('admin_account', JSON.stringify(adminAccount));
            
            storedOTP = null;
            
            showSuccess('Password reset successfully! Redirecting to login...');
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
        
        // Initialize
        displayRegisteredEmail();
        syncProfileEmail();
    </script>
    <script src="script.js"></script>
      <script src ="saveData/About.js"></script>
  <script src="saveData/Contact.js"></script>
  <script src="saveData/Current.js"></script>
  <script src="saveData/feature.js"></script>
  <script src="saveData/Professional.js"></script>
  <script src="saveData/Service.js"></script>
  <script src="saveData/skill.js"></script>
  <script src="saveData/Project.js"></script>
  <script src="saveData/TeamWork.js"></script>
</body>
</html>
