<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio CMS</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a2a;
            color: #fff;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #1a1a3a;
            padding: 25px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #2d2d4a;
            z-index: 100;
        }

        .sidebar h2 {
            text-align: center;
            color: #0ef;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .sidebar h2 i {
            margin-right: 10px;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            margin: 5px 0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: #0ef;
            color: #1a1a3a;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e1e3e, #16213e);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #2d2d4a;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #0ef;
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 32px;
            font-weight: bold;
            color: #0ef;
        }

        .form-container {
            background: #1e1e3e;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #2d2d4a;
        }

        .form-container h3 {
            margin-bottom: 20px;
            color: #0ef;
            font-size: 22px;
            border-bottom: 1px solid #2d2d4a;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0ef;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #0ef, #00a3c4);
            color: #1a1a3a;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 238, 255, 0.4);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
        }

        .btn-edit {
            background: #ffa502;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .data-table {
            background: #1e1e3e;
            border-radius: 15px;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid #2d2d4a;
        }

        .data-table h3 {
            padding: 20px 20px 0 20px;
            color: #0ef;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2d2d4a;
        }

        .data-table th {
            background: #2a2a4a;
            color: #0ef;
        }

        .skill-item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .skill-item-row input {
            flex: 1;
            padding: 10px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
        }

        .message-card {
            background: #2a2a4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #0ef, #0066cc);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .login-info {
            background: #2a2a4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 2000;
            animation: slideDown 0.3s ease;
        }

        .alert-success {
            background: rgba(0, 214, 143, 0.95);
            color: white;
        }

        .alert-error {
            background: rgba(255, 71, 87, 0.95);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e1e3e;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #0ef;
        }

        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

            .sidebar h2 span,
            .sidebar nav a span {
                display: none;
            }

            .main-content {
                margin-left: 70px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar">
            <h2><i class='bx bx-code-alt'></i> <span>CMS</span></h2>
            <nav>
                <a onclick="showSection('dashboard')" class="active"><i class='bx bxs-dashboard'></i> <span>Dashboard</span></a>
                <a onclick="showSection('profile')"><i class='bx bxs-user'></i> <span>Profile</span></a>
                <a onclick="showSection('about')"><i class='bx bxs-info-circle'></i> <span>About</span></a>
                <a onclick="showSection('services')"><i class='bx bxs-briefcase'></i> <span>Services</span></a>
                <a onclick="showSection('skills')"><i class='bx bxs-cog'></i> <span>Skills</span></a>
                <a onclick="showSection('projects')"><i class='bx bxs-folder-open'></i> <span>Projects</span></a>
                <a onclick="showSection('teamwork')"><i class='bx bxs-group'></i> <span>TeamWork</span></a>
                <a onclick="showSection('contact')"><i class='bx bxs-envelope'></i> <span>Contact</span></a>
                <a href="index.html" target="_blank"><i class='bx bxs-show'></i> <span>View Site</span></a>
                <a onclick="logout()"><i class='bx bxs-log-out'></i> <span>Logout</span></a>
            </nav>
        </div>
        <div class="main-content" id="mainContent">
            <div style="text-align: center; padding: 50px;">Loading...</div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Edit Item</h3>
            <div id="modalBody"></div>
            <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>

    <script>
        // Check login
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        let currentEditType = null;
        let currentEditIndex = null;

        // Data storage keys
        const STORAGE_KEYS = {
            PROFILE: 'portfolio_profile',
            ABOUT: 'portfolio_about',
            SERVICES: 'portfolio_services',
            TECH_SKILLS: 'portfolio_skills_technical',
            PROF_SKILLS: 'portfolio_skills_professional',
            PROJECTS: 'portfolio_projects',
            TEAMWORK: 'portfolio_teamwork',
            MESSAGES: 'contact_messages'
        };

        // Default data
        function initializeData() {
            if (!localStorage.getItem(STORAGE_KEYS.PROFILE)) {
                localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify({
                    name: 'Rahul Mahato',
                    title: 'Full Stack Developer',
                    bio: 'I\'m a web Designer with extensive experience.',
                    image: './images/ME.jpeg',
                    cv: 'cv/cv-3.docx',
                    email: 'admin@gmail.com',
                    phone: '+977 98XXXXXXXX',
                    address: 'Kathmandu, Nepal'
                }));
            }

            if (!localStorage.getItem(STORAGE_KEYS.ABOUT)) {
                localStorage.setItem(STORAGE_KEYS.ABOUT, JSON.stringify({
                    mainText: 'Full Stack Developer',
                    paragraphs: [
                        "I'm a Computer Science student at Techspire College in Kathmandu, Nepal.",
                        "My journey in technology started with curiosity about how things work.",
                        "When I'm not coding, you can find me exploring new design trends."
                    ]
                }));
            }

            if (!localStorage.getItem(STORAGE_KEYS.SERVICES)) {
                localStorage.setItem(STORAGE_KEYS.SERVICES, JSON.stringify([
                    { id: 1, icon: 'bx bx-code', title: 'Web Development', description: 'Modern responsive websites.' },
                    { id: 2, icon: 'bx bx-crop', title: 'UI/UX Design', description: 'Beautiful interfaces.' },
                    { id: 3, icon: 'bx bxl-apple', title: 'App Design', description: 'Mobile-first design.' }
                ]));
            }

            if (!localStorage.getItem(STORAGE_KEYS.TECH_SKILLS)) {
                localStorage.setItem(STORAGE_KEYS.TECH_SKILLS, JSON.stringify([
                    { id: 1, name: 'HTML5', level: 90, icon: 'bx bxl-html5' },
                    { id: 2, name: 'CSS3', level: 85, icon: 'bx bxl-css3' },
                    { id: 3, name: 'JavaScript', level: 80, icon: 'bx bxl-javascript' },
                    { id: 4, name: 'React', level: 75, icon: 'bx bxl-react' }
                ]));
            }

            if (!localStorage.getItem(STORAGE_KEYS.PROF_SKILLS)) {
                localStorage.setItem(STORAGE_KEYS.PROF_SKILLS, JSON.stringify([
                    { id: 1, name: 'Creativity', level: 90 },
                    { id: 2, name: 'Communication', level: 65 },
                    { id: 3, name: 'Problem Solving', level: 85 },
                    { id: 4, name: 'Team Work', level: 89 }
                ]));
            }

            if (!localStorage.getItem(STORAGE_KEYS.PROJECTS)) {
                localStorage.setItem(STORAGE_KEYS.PROJECTS, JSON.stringify([
                    { id: 1, title: 'E-Commerce Dashboard', description: 'Modern admin dashboard.', image: 'images/E-comerce.png', technologies: ['React', 'Node.js'] },
                    { id: 2, title: 'Task Management App', description: 'Collaborative task management.', image: 'images/task-management.png', technologies: ['Vue.js', 'Express'] },
                    { id: 3, title: 'Portfolio Website', description: 'Responsive portfolio website.', image: 'images/website.png', technologies: ['HTML', 'CSS', 'JS'] }
                ]));
            }

            if (!localStorage.getItem(STORAGE_KEYS.TEAMWORK)) {
                localStorage.setItem(STORAGE_KEYS.TEAMWORK, JSON.stringify([
                    { id: 1, title: 'Open Source Contribution', description: 'Collaborated with global developers.', image: '', role: 'Contributor' },
                    { id: 2, title: 'Hackathon Winner', description: 'First place at college hackathon.', image: '', role: 'Team Lead' }
                ]));
            }

            if (!localStorage.getItem(STORAGE_KEYS.MESSAGES)) {
                localStorage.setItem(STORAGE_KEYS.MESSAGES, JSON.stringify([]));
            }
        }

        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class='bx bx-${type === 'success' ? 'check-circle' : 'error'}'></i> ${message}`;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function getData(key) {
            return JSON.parse(localStorage.getItem(key) || '[]');
        }

        function setData(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
            showAlert(`✅ ${key.replace('portfolio_', '').replace('_', ' ')} saved!`);
        }

        function showSection(section) {
            document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
            if (event && event.target) event.target.closest('a').classList.add('active');

            const content = document.getElementById('mainContent');
            switch (section) {
                case 'dashboard':
                    content.innerHTML = renderDashboard();
                    break;
                case 'profile':
                    content.innerHTML = renderProfile();
                    break;
                case 'about':
                    content.innerHTML = renderAbout();
                    break;
                case 'services':
                    content.innerHTML = renderServices();
                    break;
                case 'skills':
                    content.innerHTML = renderSkills();
                    break;
                case 'projects':
                    content.innerHTML = renderProjects();
                    break;
                case 'teamwork':
                    content.innerHTML = renderTeamwork();
                    break;
                case 'contact':
                    content.innerHTML = renderContact();
                    break;
                default:
                    content.innerHTML = renderDashboard();
            }
        }

        function renderDashboard() {
            const profile = JSON.parse(localStorage.getItem(STORAGE_KEYS.PROFILE) || '{}');
            const services = getData(STORAGE_KEYS.SERVICES);
            const projects = getData(STORAGE_KEYS.PROJECTS);
            const skills = getData(STORAGE_KEYS.TECH_SKILLS);
            const messages = getData(STORAGE_KEYS.MESSAGES);

            return `
                <div class="welcome-banner">
                    <div>
                        <h3>Welcome, ${escapeHtml(profile.name || 'Admin')}!</h3>
                        <p>LocalStorage CMS - All data saved in your browser</p>
                    </div>
                    <div>
                        <div class="time">${new Date().toLocaleTimeString()}</div>
                        <div>${new Date().toLocaleDateString()}</div>
                    </div>
                </div>
                <div class="login-info">
                    <div><i class='bx bx-user-circle'></i> <strong>Logged in as:</strong> ${escapeHtml(profile.name || 'Admin')}</div>
                    <div><i class='bx bx-envelope'></i> <strong>Email:</strong> ${escapeHtml(profile.email || 'admin@gmail.com')}</div>
                    <div><i class='bx bx-data'></i> <strong>Storage:</strong> LocalStorage (No server needed)</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card" onclick="showSection('profile')"><h3>Profile</h3><p>✅</p><small>${escapeHtml(profile.name || 'Not set')}</small></div>
                    <div class="stat-card" onclick="showSection('services')"><h3>Services</h3><p>${services.length}</p></div>
                    <div class="stat-card" onclick="showSection('projects')"><h3>Projects</h3><p>${projects.length}</p></div>
                    <div class="stat-card" onclick="showSection('skills')"><h3>Skills</h3><p>${skills.length}</p></div>
                    <div class="stat-card" onclick="showSection('contact')"><h3>Messages</h3><p>${messages.length}</p></div>
                </div>
                <div class="form-container">
                    <h3><i class='bx bx-data'></i> LocalStorage CMS</h3>
                    <p>All data is stored in your browser's LocalStorage. No server or database needed!</p>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px;">
                        <div><strong>📊 Storage Type:</strong> Browser LocalStorage</div>
                        <div><strong>💾 Data Persistence:</strong> Stays until browser cache cleared</div>
                        <div><strong>🔐 Login Status:</strong> Active</div>
                        <div><strong>📱 Works Offline:</strong> Yes</div>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            const profile = JSON.parse(localStorage.getItem(STORAGE_KEYS.PROFILE) || '{}');
            return `
                <div class="form-container">
                    <h3><i class='bx bx-user-edit'></i> Edit Profile</h3>
                    <div class="form-group"><label>Full Name</label><input type="text" id="profileName" value="${escapeHtml(profile.name || '')}"></div>
                    <div class="form-group"><label>Title</label><input type="text" id="profileTitle" value="${escapeHtml(profile.title || '')}"></div>
                    <div class="form-group"><label>Bio</label><textarea id="profileBio" rows="3">${escapeHtml(profile.bio || '')}</textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="profileImage" value="${profile.image || ''}"></div>
                    <div class="form-group"><label>CV URL</label><input type="text" id="profileCV" value="${profile.cv || ''}"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="profileEmail" value="${profile.email || ''}"></div>
                    <div class="form-group"><label>Phone</label><input type="text" id="profilePhone" value="${profile.phone || ''}"></div>
                    <div class="form-group"><label>Address</label><input type="text" id="profileAddress" value="${profile.address || ''}"></div>
                    <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
                </div>
            `;
        }

        function saveProfile() {
            const profile = {
                name: document.getElementById('profileName').value,
                title: document.getElementById('profileTitle').value,
                bio: document.getElementById('profileBio').value,
                image: document.getElementById('profileImage').value,
                cv: document.getElementById('profileCV').value,
                email: document.getElementById('profileEmail').value,
                phone: document.getElementById('profilePhone').value,
                address: document.getElementById('profileAddress').value
            };
            localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(profile));
            showAlert('Profile saved!');
            showSection('profile');
        }

        function renderAbout() {
            const about = JSON.parse(localStorage.getItem(STORAGE_KEYS.ABOUT) || '{}');
            const paragraphs = about.paragraphs || ['', '', ''];
            return `
                <div class="form-container">
                    <h3>Edit About Section</h3>
                    <div class="form-group"><label>Subtitle</label><input type="text" id="aboutSubtitle" value="${escapeHtml(about.mainText || '')}"></div>
                    <div class="form-group"><label>Paragraph 1</label><textarea id="aboutPara1" rows="3">${escapeHtml(paragraphs[0] || '')}</textarea></div>
                    <div class="form-group"><label>Paragraph 2</label><textarea id="aboutPara2" rows="3">${escapeHtml(paragraphs[1] || '')}</textarea></div>
                    <div class="form-group"><label>Paragraph 3</label><textarea id="aboutPara3" rows="3">${escapeHtml(paragraphs[2] || '')}</textarea></div>
                    <button class="btn-primary" onclick="saveAbout()">Save About</button>
                </div>
            `;
        }

        function saveAbout() {
            const about = {
                mainText: document.getElementById('aboutSubtitle').value,
                paragraphs: [
                    document.getElementById('aboutPara1').value,
                    document.getElementById('aboutPara2').value,
                    document.getElementById('aboutPara3').value
                ]
            };
            localStorage.setItem(STORAGE_KEYS.ABOUT, JSON.stringify(about));
            showAlert('About section saved!');
            showSection('about');
        }

        function renderServices() {
            let services = getData(STORAGE_KEYS.SERVICES);
            return `
                <div class="form-container">
                    <h3>Add New Service</h3>
                    <div class="form-group"><label>Icon (bx bx-code)</label><input type="text" id="newServiceIcon" value="bx bx-code"></div>
                    <div class="form-group"><label>Title</label><input type="text" id="newServiceTitle"></div>
                    <div class="form-group"><label>Description</label><textarea id="newServiceDesc" rows="3"></textarea></div>
                    <button class="btn-primary" onclick="addService()">+ Add Service</button>
                </div>
                <div class="data-table">
                    <h3>Services (${services.length})</h3>
                    <table>
                        <thead>
                            <tr><th>Icon</th><th>Title</th><th>Description</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            ${services.map((s, i) => `
                                <tr>
                                    <td><i class='${s.icon}' style="font-size:24px;color:#0ef;"></i></td>
                                    <td><strong>${escapeHtml(s.title)}</strong></td>
                                    <td>${escapeHtml(s.description.substring(0, 80))}...</td>
                                    <td>
                                        <button class="btn-edit" onclick="openEditModal('service', ${i})">Edit</button>
                                        <button class="btn-danger" onclick="deleteService(${i})">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function addService() {
            const services = getData(STORAGE_KEYS.SERVICES);
            const title = document.getElementById('newServiceTitle').value;
            const desc = document.getElementById('newServiceDesc').value;
            if (!title || !desc) {
                showAlert('Please fill all fields!', 'error');
                return;
            }
            services.push({
                id: Date.now(),
                icon: document.getElementById('newServiceIcon').value,
                title: title,
                description: desc
            });
            setData(STORAGE_KEYS.SERVICES, services);
            showSection('services');
        }

        function deleteService(index) {
            if (confirm('Delete this service?')) {
                const services = getData(STORAGE_KEYS.SERVICES);
                services.splice(index, 1);
                setData(STORAGE_KEYS.SERVICES, services);
                showSection('services');
            }
        }

        function renderSkills() {
            const technical = getData(STORAGE_KEYS.TECH_SKILLS);
            const professional = getData(STORAGE_KEYS.PROF_SKILLS);
            return `
                <div class="form-container">
                    <h3>Technical Skills</h3>
                    ${technical.map((s, i) => `
                        <div class="skill-item-row">
                            <input type="text" id="techName${i}" value="${escapeHtml(s.name)}">
                            <input type="number" id="techLevel${i}" value="${s.level}" style="width:100px;">
                            <button class="btn-edit" onclick="updateTechnicalSkill(${i})">Save</button>
                            <button class="btn-danger" onclick="deleteTechnicalSkill(${i})">Delete</button>
                        </div>
                    `).join('')}
                    <div style="margin-top:20px;">
                        <h4>Add Technical Skill</h4>
                        <div class="skill-item-row">
                            <input type="text" id="newTechName" placeholder="Skill name">
                            <input type="number" id="newTechLevel" placeholder="Level" style="width:100px;">
                            <button class="btn-primary" onclick="addTechnicalSkill()">Add</button>
                        </div>
                    </div>
                </div>
                <div class="form-container">
                    <h3>Professional Skills</h3>
                    ${professional.map((s, i) => `
                        <div class="skill-item-row">
                            <input type="text" id="profName${i}" value="${escapeHtml(s.name)}">
                            <input type="number" id="profLevel${i}" value="${s.level}" style="width:100px;">
                            <button class="btn-edit" onclick="updateProfessionalSkill(${i})">Save</button>
                            <button class="btn-danger" onclick="deleteProfessionalSkill(${i})">Delete</button>
                        </div>
                    `).join('')}
                    <div style="margin-top:20px;">
                        <h4>Add Professional Skill</h4>
                        <div class="skill-item-row">
                            <input type="text" id="newProfName" placeholder="Skill name">
                            <input type="number" id="newProfLevel" placeholder="Level" style="width:100px;">
                            <button class="btn-primary" onclick="addProfessionalSkill()">Add</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function addTechnicalSkill() {
            const skills = getData(STORAGE_KEYS.TECH_SKILLS);
            const name = document.getElementById('newTechName')?.value;
            const level = parseInt(document.getElementById('newTechLevel')?.value);
            if (!name || isNaN(level)) {
                showAlert('Enter name and level!', 'error');
                return;
            }
            skills.push({ id: Date.now(), name: name, level: level, icon: 'bx bx-code' });
            setData(STORAGE_KEYS.TECH_SKILLS, skills);
            showSection('skills');
        }

        function deleteTechnicalSkill(index) {
            if (confirm('Delete this skill?')) {
                const skills = getData(STORAGE_KEYS.TECH_SKILLS);
                skills.splice(index, 1);
                setData(STORAGE_KEYS.TECH_SKILLS, skills);
                showSection('skills');
            }
        }

        function updateTechnicalSkill(index) {
            const skills = getData(STORAGE_KEYS.TECH_SKILLS);
            skills[index].name = document.getElementById(`techName${index}`).value;
            skills[index].level = parseInt(document.getElementById(`techLevel${index}`).value);
            setData(STORAGE_KEYS.TECH_SKILLS, skills);
            showSection('skills');
        }

        function addProfessionalSkill() {
            const skills = getData(STORAGE_KEYS.PROF_SKILLS);
            const name = document.getElementById('newProfName')?.value;

            if (!name || isNaN(level)) {
                showAlert('Enter name and level!', 'error');
                return;
            }
            skills.push({ id: Date.now(), name: name, level: level });
            setData(STORAGE_KEYS.PROF_SKILLS, skills);
            showSection('skills');
        }

        function deleteProfessionalSkill(index) {
            if (confirm('Delete this skill?')) {
                const skills = getData(STORAGE_KEYS.PROF_SKILLS);
                skills.splice(index, 1);
                setData(STORAGE_KEYS.PROF_SKILLS, skills);
                showSection('skills');
            }
        }

        function updateProfessionalSkill(index) {
            const skills = getData(STORAGE_KEYS.PROF_SKILLS);
            skills[index].name = document.getElementById(`profName${index}`).value;
            skills[index].level = parseInt(document.getElementById(`profLevel${index}`).value);
            setData(STORAGE_KEYS.PROF_SKILLS, skills);
            showSection('skills');
        }

        function renderProjects() {
            let projects = getData(STORAGE_KEYS.PROJECTS);
            return `
                <div class="form-container">
                    <h3>Add New Project</h3>
                    <div class="form-group"><label>Title</label><input type="text" id="newProjectTitle"></div>
                    <div class="form-group"><label>Description</label><textarea id="newProjectDesc" rows="3"></textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="newProjectImage"></div>
                    <div class="form-group"><label>Technologies</label><input type="text" id="newProjectTech" placeholder="React, Node.js"></div>
                    <button class="btn-primary" onclick="addProject()">+ Add Project</button>
                </div>
                <div class="data-table">
                    <h3>Projects (${projects.length})</h3>
                    </table><thead><tr><th>Title</th><th>Technologies</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${projects.map((p, i) => `
                            <tr>
                                <td><strong>${escapeHtml(p.title)}</strong></td>
                                <td>${(p.technologies || []).join(', ')}</td>
                                <td>
                                    <button class="btn-edit" onclick="openEditModal('project', ${i})">Edit</button>
                                    <button class="btn-danger" onclick="deleteProject(${i})">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                </div>
            `;
        }

        function addProject() {
            const projects = getData(STORAGE_KEYS.PROJECTS);
            const title = document.getElementById('newProjectTitle').value;
            const desc = document.getElementById('newProjectDesc').value;
            if (!title || !desc) {
                showAlert('Please fill title and description!', 'error');
                return;
            }
            projects.push({
                id: Date.now(),
                title: title,
                description: desc,
                image: document.getElementById('newProjectImage').value,
                technologies: document.getElementById('newProjectTech').value.split(',').map(t => t.trim())
            });
            setData(STORAGE_KEYS.PROJECTS, projects);
            showSection('projects');
        }

        function deleteProject(index) {
            if (confirm('Delete this project?')) {
                const projects = getData(STORAGE_KEYS.PROJECTS);
                projects.splice(index, 1);
                setData(STORAGE_KEYS.PROJECTS, projects);
                showSection('projects');
            }
        }

        function renderTeamwork() {
            let teamwork = getData(STORAGE_KEYS.TEAMWORK);
            return `
                <div class="form-container">
                    <h3>Add TeamWork Entry</h3>
                    <div class="form-group"><label>Title</label><input type="text" id="newTeamTitle"></div>
                    <div class="form-group"><label>Description</label><textarea id="newTeamDesc" rows="3"></textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="newTeamImage"></div>
                    <div class="form-group"><label>Role</label><input type="text" id="newTeamRole"></div>
                    <button class="btn-primary" onclick="addTeamwork()">+ Add TeamWork</button>
                </div>
                <div class="data-table">
                    <h3>TeamWork (${teamwork.length})</h3>
                    <table><thead><tr><th>Title</th><th>Role</th><th>Description</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${teamwork.map((t, i) => `
                            <tr>
                                <td><strong>${escapeHtml(t.title)}</strong></td>
                                <td>${t.role || 'Member'}</td>
                                <td>${escapeHtml(t.description.substring(0, 60))}...</td>
                                <td>
                                    <button class="btn-edit" onclick="openEditModal('teamwork', ${i})">Edit</button>
                                    <button class="btn-danger" onclick="deleteTeamwork(${i})">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                </div>
            `;
        }

        function addTeamwork() {
            const teamwork = getData(STORAGE_KEYS.TEAMWORK);
            const title = document.getElementById('newTeamTitle').value;
            const desc = document.getElementById('newTeamDesc').value;
            if (!title || !desc) {
                showAlert('Please fill title and description!', 'error');
                return;
            }
            teamwork.push({
                id: Date.now(),
                title: title,
                description: desc,
                image: document.getElementById('newTeamImage').value,
                role: document.getElementById('newTeamRole').value
            });
            setData(STORAGE_KEYS.TEAMWORK, teamwork);
            showSection('teamwork');
        }

        function deleteTeamwork(index) {
            if (confirm('Delete this teamwork entry?')) {
                const teamwork = getData(STORAGE_KEYS.TEAMWORK);
                teamwork.splice(index, 1);
                setData(STORAGE_KEYS.TEAMWORK, teamwork);
                showSection('teamwork');
            }
        }

        function renderContact() {
            const messages = getData(STORAGE_KEYS.MESSAGES);
            return `
                <div class="form-container">
                    <h3>Contact Messages (${messages.length})</h3>
                    ${messages.length === 0 ? '<p style="text-align:center;padding:40px;">No messages yet.</p>' : messages.slice().reverse().map(msg => `
                        <div class="message-card">
                            <h4><i class='bx bxs-user'></i> ${escapeHtml(msg.name)}</h4>
                            <p><i class='bx bxs-envelope'></i> ${escapeHtml(msg.email)}</p>
                            <div class="message-date">${new Date(msg.date).toLocaleString()}</div>
                            <p><strong>Message:</strong> ${escapeHtml(msg.message)}</p>
                            <button class="btn-danger" onclick="deleteMessage(${msg.id})">Delete Message</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function deleteMessage(id) {
            if (confirm('Delete this message?')) {
                let messages = getData(STORAGE_KEYS.MESSAGES);
                messages = messages.filter(msg => msg.id !== id);
                setData(STORAGE_KEYS.MESSAGES, messages);
                showSection('contact');
            }
        }

        // Edit Modal Functions
        function openEditModal(type, index) {
            currentEditType = type;
            currentEditIndex = index;
            const modal = document.getElementById('editModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            if (type === 'service') {
                const services = getData(STORAGE_KEYS.SERVICES);
                const item = services[index];
                modalTitle.innerHTML = 'Edit Service';
                modalBody.innerHTML = `
                    <div class="form-group"><label>Icon</label><input type="text" id="editIcon" value="${item.icon}"></div>
                    <div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div>
                    <div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div>
                `;
            } else if (type === 'project') {
                const projects = getData(STORAGE_KEYS.PROJECTS);
                const item = projects[index];
                modalTitle.innerHTML = 'Edit Project';
                modalBody.innerHTML = `
                    <div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div>
                    <div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="editImage" value="${item.image || ''}"></div>
                    <div class="form-group"><label>Technologies</label><input type="text" id="editTech" value="${(item.technologies || []).join(', ')}"></div>
                `;
            } else if (type === 'teamwork') {
                const teamwork = getData(STORAGE_KEYS.TEAMWORK);
                const item = teamwork[index];
                modalTitle.innerHTML = 'Edit TeamWork';
                modalBody.innerHTML = `
                    <div class="form-group"><label>Title</label><input type="text" id="editTitle" value="${escapeHtml(item.title)}"></div>
                    <div class="form-group"><label>Description</label><textarea id="editDesc" rows="4">${escapeHtml(item.description)}</textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="editImage" value="${item.image || ''}"></div>
                    <div class="form-group"><label>Role</label><input type="text" id="editRole" value="${item.role || ''}"></div>
                `;
            }
            modal.style.display = 'flex';
        }

        function saveEdit() {
            if (currentEditType === 'service') {
                let services = getData(STORAGE_KEYS.SERVICES);
                services[currentEditIndex] = {
                    ...services[currentEditIndex],
                    icon: document.getElementById('editIcon').value,
                    title: document.getElementById('editTitle').value,
                    description: document.getElementById('editDesc').value
                };
                setData(STORAGE_KEYS.SERVICES, services);
                showSection('services');
            } else if (currentEditType === 'project') {
                let projects = getData(STORAGE_KEYS.PROJECTS);
                projects[currentEditIndex] = {
                    ...projects[currentEditIndex],
                    title: document.getElementById('editTitle').value,
                    description: document.getElementById('editDesc').value,
                    image: document.getElementById('editImage').value,
                    technologies: document.getElementById('editTech').value.split(',').map(t => t.trim())
                };
                setData(STORAGE_KEYS.PROJECTS, projects);
                showSection('projects');
            } else if (currentEditType === 'teamwork') {
                let teamwork = getData(STORAGE_KEYS.TEAMWORK);
                teamwork[currentEditIndex] = {
                    ...teamwork[currentEditIndex],
                    title: document.getElementById('editTitle').value,
                    description: document.getElementById('editDesc').value,
                    image: document.getElementById('editImage').value,
                    role: document.getElementById('editRole').value
                };
                setData(STORAGE_KEYS.TEAMWORK, teamwork);
                showSection('teamwork');
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditType = null;
            currentEditIndex = null;
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        }

        // Make functions global
        window.showSection = showSection;
        window.saveProfile = saveProfile;
        window.saveAbout = saveAbout;
        window.addService = addService;
        window.deleteService = deleteService;
        window.addTechnicalSkill = addTechnicalSkill;
        window.deleteTechnicalSkill = deleteTechnicalSkill;
        window.updateTechnicalSkill = updateTechnicalSkill;
        window.addProfessionalSkill = addProfessionalSkill;
        window.deleteProfessionalSkill = deleteProfessionalSkill;
        window.updateProfessionalSkill = updateProfessionalSkill;
        window.addProject = addProject;
        window.deleteProject = deleteProject;
        window.addTeamwork = addTeamwork;
        window.deleteTeamwork = deleteTeamwork;
        window.deleteMessage = deleteMessage;
        window.openEditModal = openEditModal;
        window.saveEdit = saveEdit;
        window.closeModal = closeModal;
        window.logout = logout;

        // Initialize
        initializeData();
        showSection('dashboard');
    </script>
</body>
</html>
