<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a, #071b27); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: #1e293b; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 0 30px rgba(0,238,255,0.2); border: 1px solid #0ef; }
        .login-container h2 { text-align: center; color: #0ef; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #0ef; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 16px; }
        .btn-login { width: 100%; padding: 12px; background: linear-gradient(90deg, #0ef, #00a3c4); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .error-msg { background: rgba(255,71,87,0.2); border: 1px solid #ff4757; color: #ff4757; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: center; display: none; }
        .loading { display: none; text-align: center; margin-top: 15px; color: #0ef; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2><i class='bx bx-lock-alt'></i> Admin Login</h2>
        <div id="errorMsg" class="error-msg"></div>
        <div id="loadingMsg" class="loading"><i class='bx bx-loader-alt bx-spin'></i> Logging in...</div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group"><label>Email</label><input type="email" id="email" value="admin@gmail.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" value="admin123" required></div>
            <button type="submit" class="btn-login"><i class='bx bx-log-in'></i> Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px; font-size: 12px; opacity: 0.7;">Default: admin@gmail.com / admin123</p>
    </div>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const loadingDiv = document.getElementById('loadingMsg');
            const submitBtn = document.querySelector('.btn-login');
            
            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;
            
            try {
                console.log('Sending login request to:', '/api/login');
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('adminEmail', email);
                    localStorage.setItem('adminName', data.user.name);
                    window.location.href = '/admin.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = data.message || 'Invalid credentials';
                    setTimeout(() => { errorDiv.style.display = 'none'; }, 3000);
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Server error. Please make sure the server is running.';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 3000);
            } finally {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
