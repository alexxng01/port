<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #071b27);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 238, 255, 0.2);
            border: 1px solid #0ef;
        }

        .login-container h2 {
            text-align: center;
            color: #0ef;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0ef;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0ef, #00a3c4);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 238, 255, 0.4);
        }

        .error-msg {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2><i class='bx bx-lock-alt'></i> Admin Login</h2>
        <div id="errorMsg" class="error-msg"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="admin@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" value="admin123" required>
            </div>
            <button type="submit" class="btn-login"><i class='bx bx-log-in'></i> Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px; font-size: 12px; opacity: 0.7;">
            Default: admin@gmail.com / admin123
        </p>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Check credentials against localStorage
            const adminAccount = JSON.parse(localStorage.getItem('admin_account'));

            if (!adminAccount) {
                // Create default admin account
                const defaultAdmin = {
                    email: 'admin@gmail.com',
                    password: 'admin123',
                    name: 'Admin User'
                };
                localStorage.setItem('admin_account', JSON.stringify(defaultAdmin));
                
                if (email === defaultAdmin.email && password === defaultAdmin.password) {
                    localStorage.setItem('isLoggedIn', 'true');
                    window.location.href = 'admin.html';
                } else {
                    showError('Invalid credentials');
                }
            } else if (email === adminAccount.email && password === adminAccount.password) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                showError('Invalid credentials');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.style.display = 'block';
            errorDiv.innerText = message;
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
